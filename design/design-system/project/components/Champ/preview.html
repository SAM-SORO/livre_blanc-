<!-- @dsCard group="Formulaires" height=330 -->
<div class="lbc" style="padding:24px">
<div style="display:grid;gap:24px">
  <label class="lbc-champ">
    <span class="lbc-champ__libelle">Qu'est-ce qui ne va pas ?</span>
    <span class="lbc-champ__aide">Décrivez la situation telle que vous la vivez. Exemple : « La maternité n'a que deux lits pour tout le quartier. »</span>
    <textarea class="lbc-champ__saisie" rows="3">La maternité du quartier manque de lits, de couveuses et de matériel d'accouchement.</textarea>
    <span class="lbc-champ__compteur">86 / 1 500</span>
  </label>
  <label class="lbc-champ lbc-champ--erreur">
    <span class="lbc-champ__libelle">Titre de votre contribution</span>
    <input class="lbc-champ__saisie" value="Maternité" aria-invalid="true">
    <span class="lbc-champ__erreur">Écrivez un titre de 10 caractères au moins, par exemple « Maternité sans couveuse à Gagnoa ».</span>
  </label>
</div>
</div>
<script>document.documentElement.lang = "fr";</script>
