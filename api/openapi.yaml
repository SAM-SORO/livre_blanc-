components:
  schemas:
    Probleme:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        regle:
          type: string
          pattern: ^RG-\d+$
        idRequete:
          type: string
        erreurs:
          type: array
          items:
            type: object
            properties:
              champ:
                type: string
              message:
                type: string
    Pagination:
      type: object
      properties:
        suivant:
          type:
          - string
          - 'null'
        total:
          type: integer
    Tache:
      type: object
      properties:
        idTache:
          type: string
          format: uuid
        etat:
          enum:
          - EN_ATTENTE
          - EN_COURS
          - TERMINEE
          - ECHEC
        suivi:
          type: string
    Urgence:
      enum:
      - FAIBLE
      - MOYENNE
      - ELEVEE
      - CRITIQUE
    TranchePopulation:
      enum:
      - MOINS_500
      - DE_500_A_5000
      - DE_5000_A_50000
      - PLUS_50000
      - INCONNUE
    Inscription:
      type: object
      required:
      - nom
      - prenoms
      - email
      - motDePasse
      - anneeNaissance
      - idTerritoireResidence
      - accepteCharte
      - consentementDonnees
      properties:
        nom:
          type: string
          maxLength: 100
        prenoms:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        motDePasse:
          type: string
          minLength: 10
        anneeNaissance:
          type: integer
        sexe:
          enum:
          - F
          - M
          - null
        telephone:
          type:
          - string
          - 'null'
        idTerritoireResidence:
          type: string
          format: uuid
        afficherNom:
          type: boolean
        accepteCharte:
          const: true
        consentementDonnees:
          const: true
    TexteContribution:
      type: object
      required:
      - idTerritoire
      - titre
      - constat
      - proposition
      properties:
        idTerritoire:
          type: string
          format: uuid
        idSecteur:
          type: string
          format: uuid
        titre:
          type: string
        constat:
          type: string
        proposition:
          type: string
    ContributionCreation:
      type: object
      required:
      - titre
      - constat
      - proposition
      - idSecteur
      - idTerritoire
      - urgence
      properties:
        titre:
          type: string
          minLength: 10
          maxLength: 120
        constat:
          type: string
          minLength: 30
          maxLength: 1500
        proposition:
          type: string
          minLength: 20
          maxLength: 1500
        idSecteur:
          type: string
          format: uuid
        idTerritoire:
          type: string
          format: uuid
        localite:
          type:
          - string
          - 'null'
          maxLength: 150
        urgence:
          $ref: '#/components/schemas/Urgence'
        tranchePopulation:
          anyOf:
          - $ref: '#/components/schemas/TranchePopulation'
          - type: 'null'
        idOrganisation:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        idFichiersIllustration:
          type: array
          maxItems: 3
          items:
            type: string
            format: uuid
        idClient:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Identifiant attribué par la version mobile (RG-30)
        saisieLe:
          type:
          - string
          - 'null'
          format: date-time
          description: Date de rédaction hors connexion
    ContributionCreee:
      type: object
      properties:
        idContribution:
          type: string
          format: uuid
        reference:
          type: string
        statut:
          type: string
        horsResidence:
          type: boolean
        enModeration:
          type: boolean
        preoccupation:
          type: object
          properties:
            idPreoccupation:
              type: string
              format: uuid
            intitule:
              type: string
            nouvelle:
              type: boolean
            similarite:
              type:
              - number
              - 'null'
    Fusion:
      type: object
      required:
      - idCible
      - idsAbsorbees
      properties:
        idCible:
          type: string
          format: uuid
        idsAbsorbees:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        intitule:
          type: string
    DecisionConvergence:
      type: object
      required:
      - action
      properties:
        action:
          enum:
          - RETENIR
          - REJETER
          - FUSIONNER
          - SCINDER
          - RECLASSER
          - REOUVRIR
        motif:
          type: string
        classe:
          enum:
          - NATIONALE
          - PARTAGEE
          - SPECIFIQUE
        idCible:
          type: string
          format: uuid
        groupes:
          type: array
          items:
            type: array
            items:
              type: string
              format: uuid
    EngagementCreation:
      type: object
      required:
      - echeanceAnnee
      - texte
      properties:
        idConvergence:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        idPreoccupation:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        echeanceAnnee:
          type: integer
        texte:
          type: string
          minLength: 20
          maxLength: 1000
    SuiviCreation:
      type: object
      required:
      - etat
      - dateEtat
      - description
      - justificatifs
      properties:
        etat:
          enum:
          - NON_DEMARRE
          - EN_COURS
          - REALISE
          - PARTIELLEMENT_REALISE
          - ABANDONNE
        dateEtat:
          type: string
          format: date
        description:
          type: string
        justificatifs:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - type
            - libelle
            properties:
              type:
                enum:
                - LIEN
                - FICHIER
              url:
                type: string
                format: uri
              idFichier:
                type: string
                format: uuid
              libelle:
                type: string
    ControlesPublication:
      type: object
      properties:
        publiable:
          type: boolean
        blocages:
          type: array
          items:
            type: object
            properties:
              regle:
                type: string
              message:
                type: string
              lien:
                type: string
        avertissements:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nuxt-session
      description: Cookie de session scellé (nuxt-auth-utils) ; nom configurable
